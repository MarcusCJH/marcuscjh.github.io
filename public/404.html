<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c6f24e" />
    <title>404 — Not found | marcus.cjh</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@300..700&display=swap"
    />
    <style>
      /* Standalone page — the same tokens as src/styles/style.css, inlined so
         this renders without the app bundle. Keep the two in step. */
      :root {
        --ink-900: #08090a;
        --ink-850: #0b0c0d;
        --fg: #f2f4f4;
        --fg-muted: #a3a8a9;
        --fg-faint: #7c8183;
        --line: rgb(242 244 244 / 0.09);
        --line-faint: rgb(242 244 244 / 0.035);
        --line-strong: rgb(242 244 244 / 0.17);
        --acid: #c6f24e;
        --on-acid: #0a0d05;
        --gutter: clamp(16px, 4vw, 40px);
        --font-display: 'Archivo', ui-sans-serif, system-ui, Helvetica, Arial, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        color-scheme: dark;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        align-content: center;
        padding: var(--gutter);
        background: var(--ink-900);
        color: var(--fg);
        font-family: var(--font-display);
        font-size: 1rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      /* Same ambient 12-column hairline grid as the main site. */
      .field {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      .field::before {
        content: '';
        position: absolute;
        inset: 0;
        width: min(100%, 1440px);
        margin-inline: auto;
        background-image: repeating-linear-gradient(
          to right,
          var(--line-faint) 0 1px,
          transparent 1px calc(100% / 12)
        );
      }

      main {
        position: relative;
        z-index: 1;
        width: min(100%, 1440px);
        margin-inline: auto;
      }

      .eyebrow {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--fg-faint);
      }

      .code {
        margin: -0.08em 0 0;
        font-size: clamp(5rem, 22vw, 15rem);
        font-weight: 620;
        font-stretch: 84%;
        letter-spacing: -0.05em;
        line-height: 0.84;
      }

      .lede {
        max-width: 48ch;
        margin: 0 0 32px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--fg-muted);
      }

      .terminal {
        display: inline-block;
        margin-bottom: 32px;
        padding: 12px 16px;
        background: var(--ink-850);
        border: 1px solid var(--line);
        border-left: 2px solid var(--acid);
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        color: var(--fg-muted);
      }

      .terminal div + div {
        margin-top: 4px;
      }

      .prompt {
        color: var(--acid);
        margin-right: 0.75ch;
      }

      .command {
        color: var(--fg);
      }

      .caret {
        display: inline-block;
        width: 0.55ch;
        height: 1.05em;
        vertical-align: text-bottom;
        background: var(--acid);
        animation: caret 1.05s steps(1, end) infinite;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.7ch;
        min-height: 44px;
        padding-inline: 16px;
        border: 1px solid var(--line-strong);
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        letter-spacing: 0.03em;
        color: var(--fg);
        text-decoration: none;
        transition:
          color 140ms cubic-bezier(0.2, 0.8, 0.25, 1),
          background-color 140ms cubic-bezier(0.2, 0.8, 0.25, 1),
          border-color 140ms cubic-bezier(0.2, 0.8, 0.25, 1);
      }

      .btn-primary {
        background: var(--acid);
        border-color: var(--acid);
        color: var(--on-acid);
      }

      .btn-primary:hover {
        background: color-mix(in oklab, var(--acid) 86%, white);
      }

      .btn-ghost:hover {
        color: var(--acid);
        border-color: color-mix(in oklab, var(--acid) 38%, transparent);
        background: color-mix(in oklab, var(--acid) 9%, transparent);
      }

      :focus-visible {
        outline: 2px solid var(--acid);
        outline-offset: 2px;
        box-shadow: 0 0 0 4px var(--ink-900);
      }

      @keyframes caret {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }

        .caret {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="field" aria-hidden="true"></div>

    <main>
      <p class="eyebrow">marcus.cjh / error</p>
      <h1 class="code">404</h1>
      <p class="lede">
        This path does not resolve. It may have moved, or it may never have existed.
      </p>

      <div class="terminal">
        <div>
          <span class="prompt" aria-hidden="true">~</span><span class="command">locate .</span>
        </div>
        <div>no such file or directory</div>
        <div>
          <span class="prompt" aria-hidden="true">~</span
          ><span class="caret" aria-hidden="true"></span>
        </div>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="/">Back to homepage</a>
        <a class="btn btn-ghost" href="/#showcase-section">Browse projects</a>
      </div>
    </main>
  </body>
</html>
