version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # Keep package.json ranges and package-lock.json updated together.
    versioning-strategy: increase
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    reviewers:
      - "MarcusCJH"
    assignees:
      - "MarcusCJH"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    reviewers:
      - "MarcusCJH"
    assignees:
      - "MarcusCJH"
    commit-message:
      prefix: "chore"
      include: "scope"
