name: ✅ Merge Check

# Validates work that lives OUTSIDE master: any feature/chore branch push and
# any PR targeting master/main. Answers one question: "is this safe to merge?"
# Deployment is never performed here — see deploy.yml for that.

on:
  push:
    branches-ignore:
      - master
      - main
      - gh-pages
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch/PR; a new push cancels the stale run.
concurrency:
  group: merge-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 🔍 Quality gate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Fails if package-lock.json is out of sync with package.json.
      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint:check

      - name: 💅 Run Prettier check
        run: npm run format:check

      - name: 📝 Run TypeScript check
        run: npx tsc --noEmit

      - name: 🧪 Run tests with coverage
        run: npm run test:coverage

      - name: 🔨 Build project
        run: npm run build

      - name: 🔎 Verify build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing after build"; exit 1; }
          echo "### 🔨 Build output" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Total size: **$(du -sh dist | cut -f1)** across $(find dist -type f | wc -l) files." >> "$GITHUB_STEP_SUMMARY"

      # Not a deployment: a downloadable build so the branch can be previewed
      # locally (`npx serve dist`) before it reaches master.
      - name: 📁 Upload build preview
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: ./dist
          retention-days: 7

      - name: 📊 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: ./coverage
          retention-days: 7
          if-no-files-found: ignore

  mergeable:
    name: 🔀 Mergeable into base
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout branch history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 🔀 Check for merge conflicts
        env:
          BASE: ${{ github.event.pull_request.base.ref || 'master' }}
        run: |
          set -o pipefail
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          behind=$(git rev-list --count "HEAD..origin/$BASE")
          ahead=$(git rev-list --count "origin/$BASE..HEAD")

          {
            echo "### 🔀 Merge status vs \`$BASE\`"
            echo ""
            echo "- Commits ahead: **$ahead**"
            echo "- Commits behind: **$behind**"
          } >> "$GITHUB_STEP_SUMMARY"

          if git merge --no-commit --no-ff "origin/$BASE" >/dev/null 2>&1; then
            git merge --abort 2>/dev/null || true
            echo "- Conflicts: **none** ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "Branch merges cleanly into $BASE."
          else
            conflicts=$(git diff --name-only --diff-filter=U)
            git merge --abort 2>/dev/null || true
            {
              echo "- Conflicts: **yes** ❌"
              echo ""
              echo "Conflicting files:"
              echo '```'
              echo "$conflicts"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Branch conflicts with $BASE. Rebase or merge $BASE in before merging."
            exit 1
          fi

  merge-gate:
    name: 🚦 Merge gate
    runs-on: ubuntu-latest
    needs: [quality, mergeable]
    if: always()

    steps:
      - name: 🚦 Summarise verdict
        env:
          QUALITY: ${{ needs.quality.result }}
          MERGEABLE: ${{ needs.mergeable.result }}
        run: |
          icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }

          {
            echo "## 🚦 Merge gate"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Quality gate (lint, format, types, tests, build) | $(icon "$QUALITY") \`$QUALITY\` |"
            echo "| Mergeable into base | $(icon "$MERGEABLE") \`$MERGEABLE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$QUALITY" = "success" ] && [ "$MERGEABLE" = "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Safe to merge into master.** 🎉" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Not safe to merge.** Fix the failing check(s) above." >> "$GITHUB_STEP_SUMMARY"
          exit 1
